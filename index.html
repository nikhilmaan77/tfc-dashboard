<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fresh Connection — Not Fast, Just Furious</title>
<style>
/* ============================================================
   Design tokens. Restyle the whole dashboard from this block.
   ============================================================ */
:root{
  --cream:#FAF6ED; --cream-warm:#FCF9F2; --card:#FFFFFF;
  --orange:#EA580C; --orange-dark:#C2410C; --orange-light:#FB923C;
  --amber:#F59E0B; --amber-soft:#FDE68A;
  --navy:#0B101D; --navy-soft:#161D2E;
  --ink:#0F172A; --ink-mid:#475569; --ink-soft:#7C8698;
  --line:#EFE7D8; --line-strong:#E2D9C8;
  --good:#15803D; --good-soft:#DCFCE7;
  --bad:#B91C1C; --bad-soft:#FEE2E2;
  --warn:#B45309; --warn-soft:#FEF3C7;
  --blue:#2563EB; --blue-soft:#DBEAFE;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px;
  --shadow:0 10px 25px -5px rgba(234,88,12,.07), 0 8px 16px -6px rgba(15,23,42,.08);
  --shadow-soft:0 4px 20px -2px rgba(120,80,20,.05), 0 2px 6px -1px rgba(0,0,0,.04);
  --shadow-glow:0 10px 28px -6px rgba(234,88,12,.38);
  --sans:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --sidebar-w:272px;
  --fs-base:17px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); font-size:var(--fs-base); line-height:1.5;
  background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:800; letter-spacing:-.02em}
p{margin:0 0 .6em}
a{color:var(--orange-dark)}
table{border-collapse:collapse; width:100%}

/* ---------- ambient citrus background ---------- */
.ambient{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
.glow{position:absolute; border-radius:50%; filter:blur(90px)}
.glow-a{top:-140px; right:-120px; width:420px; height:420px; background:rgba(253,186,116,.45)}
.glow-b{bottom:-180px; left:340px; width:520px; height:520px; background:rgba(252,211,77,.40)}
.glow-c{top:32%; left:52%; width:340px; height:340px; background:rgba(254,215,170,.45)}
.citrus{position:absolute; color:rgba(234,88,12,.13)}
.citrus-a{right:70px; top:20px; width:380px; height:380px; animation:spin 240s linear infinite}
.citrus-b{left:300px; bottom:-60px; width:300px; height:300px; color:rgba(245,158,11,.12); animation:spin 300s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.citrus{animation:none!important}}

/* ---------- layout ---------- */
.app{display:flex; position:relative; z-index:1}
.sidebar{
  width:var(--sidebar-w); min-width:var(--sidebar-w); height:100vh; position:sticky; top:0;
  background:var(--navy); color:#fff; display:flex; flex-direction:column;
  padding:22px 18px; gap:18px; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.09); border-radius:var(--r-md); padding:13px 14px}
.brand-mark{width:40px; height:40px; border-radius:12px; flex:0 0 40px;
  background:linear-gradient(140deg,var(--orange-light),var(--orange-dark));
  display:grid; place-items:center; box-shadow:var(--shadow-glow)}
.brand-name{font-size:.82rem; font-weight:800; letter-spacing:.09em; line-height:1.25}
.brand-sub{font-size:.7rem; color:rgba(255,255,255,.55); letter-spacing:.05em}
.team-chip{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r-md); padding:12px 14px}
.team-chip .t{font-size:.92rem; font-weight:700}
.team-chip .s{font-size:.74rem; color:rgba(255,255,255,.55); margin-top:2px}
.nav-label{font-size:.68rem; letter-spacing:.14em; color:rgba(255,255,255,.38); font-weight:700; padding:0 6px}
nav{display:flex; flex-direction:column; gap:5px}
.nav-item{display:flex; align-items:center; gap:11px; width:100%; text-align:left; cursor:pointer;
  background:transparent; border:0; color:rgba(255,255,255,.72); font-family:inherit;
  font-size:.93rem; font-weight:600; padding:11px 13px; border-radius:12px; transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,.07); color:#fff}
.nav-item[aria-current="page"]{background:linear-gradient(100deg,var(--orange),var(--orange-dark));
  color:#fff; box-shadow:var(--shadow-glow)}
.nav-key{margin-left:auto; font-size:.72rem; font-weight:700; opacity:.55;
  border:1px solid currentColor; border-radius:6px; padding:0 6px; line-height:1.5}
.side-foot{margin-top:auto; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r-md); padding:14px}
.side-foot .k{font-size:.7rem; letter-spacing:.1em; color:rgba(255,255,255,.45); font-weight:700}
.side-foot .v{font-size:1.5rem; font-weight:800; margin-top:4px}
.side-foot .n{font-size:.75rem; color:rgba(255,255,255,.55); margin-top:6px; line-height:1.4}

.main{flex:1; min-width:0; padding:26px 30px 60px}
.topbar{display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.topbar h1{font-size:2.05rem}
.topbar .sub{color:var(--ink-mid); font-size:.98rem; margin-top:5px; max-width:70ch}
.pill{display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:5px 13px;
  font-size:.8rem; font-weight:700; background:var(--warn-soft); color:var(--warn)}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.info{background:var(--blue-soft); color:var(--blue)}
.pill.orange{background:#FFEDD5; color:var(--orange-dark)}
.round-picker{margin-left:auto; display:flex; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 8px 7px 16px;
  box-shadow:var(--shadow-soft)}
.round-picker span{font-size:.82rem; font-weight:700; color:var(--ink-mid)}
.round-picker select{font-family:inherit; font-size:.92rem; font-weight:700; color:var(--ink);
  border:0; background:var(--cream-warm); border-radius:999px; padding:7px 13px; cursor:pointer}

/* ---------- bento ---------- */
.bento{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:18px; align-items:start}
.card{grid-column:span 12; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:24px 26px; box-shadow:var(--shadow-soft);
  position:relative; overflow:hidden; min-width:0}
.card.hero{background:linear-gradient(145deg,#FB923C 0%,#EA580C 55%,#C2410C 100%);
  color:#fff; border-color:transparent; box-shadow:var(--shadow-glow)}
.card.hero .card-title,.card.hero .card-note{color:rgba(255,255,255,.85)}
.card.dark{background:var(--navy); color:#fff; border-color:transparent}
.card.dark .card-title,.card.dark .card-note{color:rgba(255,255,255,.7)}
.card.tint{background:var(--cream-warm)}
.card-watermark{position:absolute; right:-30px; top:-30px; width:190px; height:190px;
  color:rgba(234,88,12,.055); pointer-events:none}
.card.hero .card-watermark,.card.dark .card-watermark{color:rgba(255,255,255,.09)}
.card > *{position:relative; z-index:1}
.card-watermark{position:absolute!important; z-index:0}
.card-title{font-size:1.02rem; font-weight:800; letter-spacing:-.01em; margin-bottom:3px}
.card-note{font-size:.86rem; color:var(--ink-soft); margin-bottom:16px; line-height:1.5}
.card.hero .card-note{color:rgba(255,255,255,.82)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}
.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}
.s9{grid-column:span 9}.s12{grid-column:span 12}
@media (max-width:1500px){
  .s3{grid-column:span 6}.s4{grid-column:span 6}.s5{grid-column:span 12}
  .s7{grid-column:span 12}.s8{grid-column:span 12}.s9{grid-column:span 12}
}
@media (max-width:1100px){
  .s3,.s4,.s6{grid-column:span 12}
  .sidebar{position:fixed; transform:translateX(-100%)}
  .main{padding:20px}
}

/* ---------- stat tiles ---------- */
.stat-label{font-size:.82rem; font-weight:700; color:var(--ink-soft); letter-spacing:.02em}
.card.hero .stat-label{color:rgba(255,255,255,.85)}
.stat-value{font-size:2.9rem; font-weight:800; letter-spacing:-.035em; line-height:1.05; margin:6px 0 4px}
.stat-delta{font-size:.84rem; font-weight:700; color:var(--ink-soft)}
.card.hero .stat-delta{color:rgba(255,255,255,.85)}
.badge{display:inline-block; border-radius:999px; padding:3px 10px; font-size:.76rem; font-weight:800}
.badge.up{background:var(--good-soft); color:var(--good)}
.badge.down{background:var(--bad-soft); color:var(--bad)}
.badge.flat{background:var(--line); color:var(--ink-mid)}

/* ---------- misc blocks ---------- */
.quote{font-size:2.05rem; font-weight:800; line-height:1.25; letter-spacing:-.03em}
.quote-sub{margin-top:16px; font-size:1rem; line-height:1.55}
.kv{display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-mid); font-size:.9rem}
.kv .v{font-weight:800; font-size:.95rem; white-space:nowrap}
.bar-track{height:9px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:7px}
.bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--orange-light),var(--orange-dark))}
.bar-fill.good{background:linear-gradient(90deg,#4ADE80,#15803D)}
.bar-fill.bad{background:linear-gradient(90deg,#F87171,#B91C1C)}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px}
@media (max-width:1200px){.grid4,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.mini{background:var(--cream-warm); border:1px solid var(--line); border-radius:var(--r-md); padding:16px 17px}
.mini h4{font-size:.9rem; margin-bottom:9px}
.callout{margin-top:15px; background:var(--cream-warm); border-left:4px solid var(--orange);
  border-radius:0 var(--r-sm) var(--r-sm) 0; padding:12px 15px; font-size:.9rem; line-height:1.55; color:var(--ink-mid)}
.card.hero .callout,.card.dark .callout{background:rgba(255,255,255,.12); color:rgba(255,255,255,.92); border-left-color:#fff}
.lede{font-size:1.02rem; line-height:1.6; color:var(--ink-mid)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; margin:0 -4px}
th,td{text-align:right; padding:10px 12px; font-size:.9rem; white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.78rem; letter-spacing:.03em; color:var(--ink-soft); font-weight:800;
  border-bottom:2px solid var(--line-strong); background:var(--cream-warm); position:sticky; top:0}
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--orange-dark)}
th.sortable::after{content:"↕"; opacity:.35; margin-left:5px; font-size:.75rem}
th.sortable.asc::after{content:"↑"; opacity:1; color:var(--orange)}
th.sortable.desc::after{content:"↓"; opacity:1; color:var(--orange)}
tbody tr{border-bottom:1px solid var(--line)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--cream-warm)}
tbody td:first-child{font-weight:700}
td.num{font-variant-numeric:tabular-nums}
.cell-good{color:var(--good); font-weight:800}
.cell-bad{color:var(--bad); font-weight:800}
tr.total-row{background:var(--cream-warm); font-weight:800}
tr.total-row td{border-top:2px solid var(--line-strong)}

/* ---------- charts ---------- */
.chart{width:100%; max-width:1150px; height:auto; display:block; overflow:visible}
.chart text{font-family:var(--sans)}
.axis-label{font-size:15px; fill:var(--ink-soft); font-weight:600}
.value-label{font-size:15px; fill:var(--ink); font-weight:800}
.grid-line{stroke:var(--line); stroke-width:1.5}
.zero-line{stroke:var(--ink-soft); stroke-width:2}
.ref-line{stroke:var(--orange); stroke-width:2; stroke-dasharray:7 5}
.legend{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:14px; font-size:.85rem; font-weight:600; color:var(--ink-mid)}
.legend i{display:inline-block; width:14px; height:14px; border-radius:4px; margin-right:7px; vertical-align:-2px}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0}
.chart-caption{font-size:.85rem; color:var(--ink-soft); margin-top:10px; line-height:1.5}

/* ---------- timeline / phases ---------- */
.timeline{display:flex; flex-direction:column}
.tl-row{display:grid; grid-template-columns:74px 1fr 110px; gap:16px; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-round{font-weight:800; font-size:.9rem; background:var(--cream-warm); border:1px solid var(--line);
  border-radius:999px; text-align:center; padding:5px 0}
.tl-round.inherited{color:var(--ink-soft)}
.tl-text{font-size:.94rem; line-height:1.45}
.tl-roi{text-align:right; font-weight:800; font-variant-numeric:tabular-nums}

/* ---------- focus + print ---------- */
:focus-visible{outline:3px solid var(--orange); outline-offset:3px; border-radius:6px}
.view{display:none}
.view.active{display:block}
@media print{
  .sidebar,.round-picker,.ambient{display:none!important}
  .main{padding:0}
  .view{display:block!important; page-break-after:always}
  .card{box-shadow:none; break-inside:avoid}
}
#dq{margin-bottom:16px}
.dq-fail{background:var(--bad-soft); border:1px solid var(--bad); color:var(--bad);
  border-radius:var(--r-md); padding:14px 18px; font-weight:700}
</style>
</head>

/* ============================================================
   2. Helpers
   ============================================================ */
const R_LABELS = ["R0","R1","R2","R3","R4","R5","R6"];
const PRODUCTS = ["Fressie Orange 1 liter","Fressie Orange/C-power 1 liter","Fressie Orange/Mango 1 liter",
                  "Fressie Orange PET","Fressie Orange/C-power PET","Fressie Orange/Mango PET"];
const COMPONENTS = ["Pack 1 liter","PET","Orange","Mango","Vitamin C"];
const CUSTOMERS = ["Food & Groceries","LAND Market","Dominick's"];
const SUPPLIERS = ["Mono Packaging Materials","Trio PET PLC","Philyp Jones Plastics",
                   "Miami Oranges","NO8DO Mango","Seitan Vitamins","SYI"];
const WEEKS = 26;
let ROUND = 6;

const F = DATA.finance;
const eur = (v,d=0)=> v===null||v===undefined||Number.isNaN(v) ? "—"
  : (v<0?"−":"")+"€"+Math.abs(v).toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=2)=> v===null||v===undefined||Number.isNaN(v) ? "—" : ((Math.abs(v)<1e-9?0:v)*100).toFixed(d)+"%";
const num = (v,d=2)=> v===null||v===undefined||Number.isNaN(v) ? "—" : v.toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});
const signed = (v)=> (v>0?"+":"")+eur(v);

function series(section,entity,metric){
  const e = DATA[section] && DATA[section][entity];
  if(!e) return new Array(7).fill(null);
  const a = e[metric];
  return a ? a : new Array(7).fill(null);
}
function at(section,entity,metric,r=ROUND){ return series(section,entity,metric)[r]; }
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* derived */
const rmPct = F.purchaseValue.map((p,i)=> p/F.realizedRevenue[i]);
const gmPerRound = p => (at("products",p,"Gross margin per week")||0)*WEEKS;
const totalGmRound = r => F.grossMargin[r];
const roiContribution = (gmr,r=ROUND)=> gmr/F.investment[r];
const landed = (s,r=ROUND)=> (series("suppliers",s,"Purchase  value previous round")[r]||0)
                           + (series("suppliers",s,"Transport costs previous round")[r]||0);
function supplierActive(s,r){ const v = series("suppliers",s,"Purchase  value previous round")[r]; return v!==null&&v!==undefined; }
function componentsOf(prod){ return Object.keys(DATA.bom[prod]||{}); }
function criticality(comp,r=ROUND){
  let sum=0;
  PRODUCTS.forEach(p=>{ if(componentsOf(p).indexOf(comp)>=0) sum += (series("products",p,"Gross margin per week")[r]||0)*WEEKS; });
  return sum/totalGmRound(r);
}

/* ============================================================
   3. Data-quality assertions (run at startup, surfaced on failure)
   ============================================================ */
function runChecks(){
  const fails=[];
  const eq=(a,b,tol,msg)=>{ if(Math.abs(a-b)>tol) fails.push(msg+" ("+a.toFixed(2)+" vs "+b.toFixed(2)+")"); };
  for(let r=0;r<=6;r++){
    let gm=0; PRODUCTS.forEach(p=> gm += (series("products",p,"Gross margin per week")[r]||0));
    eq(gm*WEEKS, F.grossMargin[r], 25, "Round "+r+": product gross margin does not sum to total");
    let cr=0; CUSTOMERS.forEach(c=> cr += DATA.customerFinance[c].contracted[r]);
    eq(cr, F.contractedRevenue[r], 5, "Round "+r+": customer contracted revenue does not sum to total");
    eq(F.purchaseValue[r]+F.productionCosts[r], F.cogs[r], 5, "Round "+r+": purchase + production ≠ COGS");
  }
  const el=document.getElementById("dq");
  if(fails.length) el.innerHTML='<div class="dq-fail">Data check failed — '+fails.length+
    ' issue(s). Figures below may be wrong.<br>'+fails.map(esc).join("<br>")+'</div>';
  return fails;
}

/* ============================================================
   4. Chart primitives — hand-drawn inline SVG, no libraries
   ============================================================ */
const PALETTE = ["#EA580C","#2563EB","#15803D","#B45309","#7C3AED","#0891B2"];
const W=980, PAD={l:104,r:34,t:30,b:52};

function svgOpen(h,title){ return '<svg class="chart" viewBox="0 0 '+W+' '+h+'" role="img" aria-label="'+esc(title)+'">'; }
function niceScale(min,max){
  if(min===max){ max=min+1; }
  const span=max-min, step=Math.pow(10,Math.floor(Math.log10(span/4)));
  const mults=[1,2,2.5,5,10]; let s=step;
  for(const m of mults){ if(span/(step*m)<=5){ s=step*m; break; } }
  return {lo:Math.floor(min/s)*s, hi:Math.ceil(max/s)*s, step:s};
}
function srTable(title,cols,rows){
  let h='<table class="sr-only"><caption>'+esc(title)+'</caption><thead><tr>'+
    cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>';
  rows.forEach(r=> h+='<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>');
  return h+'</tbody></table>';
}

/* line chart: seriesList = [{name,values[],color?,dashed?}] */
function lineChart(seriesList, labels, o={}){
  const h=o.height||330, fmt=o.fmt||(v=>num(v,2));
  const all=[]; seriesList.forEach(s=> s.values.forEach(v=>{ if(v!==null&&v!==undefined) all.push(v); }));
  if(o.refLine!==undefined) all.push(o.refLine);
  if(o.zeroLine) all.push(0);
  const sc=niceScale(Math.min.apply(null,all), Math.max.apply(null,all));
  const x=i=> PAD.l + i*(W-PAD.l-PAD.r)/(labels.length-1);
  const y=v=> h-PAD.b - (v-sc.lo)/(sc.hi-sc.lo)*(h-PAD.t-PAD.b);
  let s=svgOpen(h,o.title||"Line chart");
  for(let v=sc.lo; v<=sc.hi+1e-9; v+=sc.step){
    s+='<line class="grid-line" x1="'+PAD.l+'" x2="'+(W-PAD.r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/>'+
       '<text class="axis-label" x="'+(PAD.l-12)+'" y="'+(y(v)+5)+'" text-anchor="end">'+esc(fmt(v))+'</text>';
  }
  if(o.zeroLine && sc.lo<0) s+='<line class="zero-line" x1="'+PAD.l+'" x2="'+(W-PAD.r)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  if(o.refLine!==undefined){
    s+='<line class="ref-line" x1="'+PAD.l+'" x2="'+(W-PAD.r)+'" y1="'+y(o.refLine)+'" y2="'+y(o.refLine)+'"/>'+
       '<text class="axis-label" x="'+(W-PAD.r)+'" y="'+(y(o.refLine)-9)+'" text-anchor="end" style="fill:var(--orange);font-weight:800">'+esc(o.refLabel||"")+'</text>';
  }
  labels.forEach((l,i)=> s+='<text class="axis-label" x="'+x(i)+'" y="'+(h-PAD.b+26)+'" text-anchor="middle">'+esc(l)+'</text>');
  seriesList.forEach((ser,si)=>{
    const col=ser.color||PALETTE[si%PALETTE.length];
    let d="", open=false;
    ser.values.forEach((v,i)=>{
      if(v===null||v===undefined){ open=false; return; }
      d += (open?" L ":" M ")+x(i)+" "+y(v); open=true;
    });
    s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"'+
       (ser.dashed?' stroke-dasharray="8 6"':'')+'/>';
    ser.values.forEach((v,i)=>{
      if(v===null||v===undefined) return;
      s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="6" fill="#fff" stroke="'+col+'" stroke-width="3">'+
         '<title>'+esc(ser.name+" · "+labels[i]+": "+fmt(v))+'</title></circle>';
      if(o.labelPoints){
        const anch = i===0 ? "start" : (i===ser.values.length-1 ? "end" : "middle");
        s+='<text class="value-label" x="'+x(i)+'" y="'+(y(v)-16)+'" text-anchor="'+anch+'">'+esc(fmt(v))+'</text>';
      }
    });
  });
  s+='</svg>';
  if(seriesList.length>1||o.forceLegend){
    s+='<div class="legend">'+seriesList.map((ser,si)=>'<span><i style="background:'+
      (ser.color||PALETTE[si%PALETTE.length])+'"></i>'+esc(ser.name)+'</span>').join("")+'</div>';
  }
  s+=srTable(o.title||"Chart data",["Series"].concat(labels),
      seriesList.map(ser=>[ser.name].concat(ser.values.map(v=>v===null||v===undefined?"—":fmt(v)))));
  return s;
}

/* bar chart, optionally diverging around zero, with a highlighted bar */
function barChart(values, labels, o={}){
  const h=o.height||330, fmt=o.fmt||(v=>num(v,2));
  const padB=o.padB||PAD.b;
  const all=values.filter(v=>v!==null&&v!==undefined).concat([0]);
  const sc=niceScale(Math.min.apply(null,all), Math.max.apply(null,all));
  const y=v=> h-padB - (v-sc.lo)/(sc.hi-sc.lo)*(h-PAD.t-padB);
  const bw=(W-PAD.l-PAD.r)/values.length*0.6;
  const cx=i=> PAD.l + (i+0.5)*(W-PAD.l-PAD.r)/values.length;
  let s=svgOpen(h,o.title||"Bar chart");
  for(let v=sc.lo; v<=sc.hi+1e-9; v+=sc.step){
    s+='<line class="grid-line" x1="'+PAD.l+'" x2="'+(W-PAD.r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/>'+
       '<text class="axis-label" x="'+(PAD.l-12)+'" y="'+(y(v)+5)+'" text-anchor="end">'+esc(fmt(v))+'</text>';
  }
  const y0=y(0);
  values.forEach((v,i)=>{
    if(v===null||v===undefined) return;
    const top=Math.min(y(v),y0), hh=Math.max(2,Math.abs(y(v)-y0));
    let col=o.highlight===i ? "#C2410C" : (o.diverging ? (v<0?"#EF4444":"#16A34A") : "#FDBA74");
    if(o.colors && o.colors[i]) col=o.colors[i];
    s+='<rect x="'+(cx(i)-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+hh+'" rx="7" fill="'+col+'">'+
       '<title>'+esc(labels[i]+": "+fmt(v))+'</title></rect>';
    s+='<text class="value-label" x="'+cx(i)+'" y="'+(v>=0?top-11:top+hh+22)+'" text-anchor="middle">'+esc(fmt(v))+'</text>';
  });
  s+='<line class="zero-line" x1="'+PAD.l+'" x2="'+(W-PAD.r)+'" y1="'+y0+'" y2="'+y0+'"/>';
  labels.forEach((l,i)=> s+='<text class="axis-label" x="'+cx(i)+'" y="'+(h-padB+40)+'" text-anchor="middle">'+esc(l)+'</text>');
  s+='</svg>'+srTable(o.title||"Chart data",["Category","Value"],labels.map((l,i)=>[l,values[i]===null?"—":fmt(values[i])]));
  return s;
}

/* horizontal bars for rankings */
function hBarChart(items, o={}){
  const fmt=o.fmt||(v=>num(v,2)), rowH=46, h=items.length*rowH+40;
  const max=Math.max.apply(null,items.map(i=>Math.abs(i.value)));
  const labW=o.labelWidth||300, barMax=W-labW-190;
  let s=svgOpen(h,o.title||"Ranking");
  items.forEach((it,i)=>{
    const yy=22+i*rowH, w=max===0?0:Math.abs(it.value)/max*barMax;
    s+='<text class="axis-label" x="0" y="'+(yy+22)+'" style="fill:var(--ink);font-weight:700">'+esc(it.label)+'</text>'+
       '<rect x="'+labW+'" y="'+(yy+6)+'" width="'+Math.max(3,w)+'" height="26" rx="8" fill="'+
       (it.color||(i===0?"#C2410C":"#FDBA74"))+'"><title>'+esc(it.label+": "+fmt(it.value))+'</title></rect>'+
       '<text class="value-label" x="'+(labW+w+14)+'" y="'+(yy+26)+'">'+esc(fmt(it.value))+'</text>';
  });
  s+='</svg>'+srTable(o.title||"Ranking",["Item","Value"],items.map(i=>[i.label,fmt(i.value)]));
  return s;
}

/* stacked bars */
function stackedBar(seriesList, labels, o={}){
  const h=o.height||340, fmt=o.fmt||(v=>pct(v,1));
  const totals=labels.map((_,i)=> seriesList.reduce((a,s)=>a+(s.values[i]||0),0));
  const sc=niceScale(0, Math.max.apply(null,totals));
  const y=v=> h-PAD.b - (v-sc.lo)/(sc.hi-sc.lo)*(h-PAD.t-PAD.b);
  const bw=(W-PAD.l-PAD.r)/labels.length*0.58;
  const cx=i=> PAD.l + (i+0.5)*(W-PAD.l-PAD.r)/labels.length;
  let s=svgOpen(h,o.title||"Stacked bar chart");
  for(let v=sc.lo; v<=sc.hi+1e-9; v+=sc.step){
    s+='<line class="grid-line" x1="'+PAD.l+'" x2="'+(W-PAD.r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/>'+
       '<text class="axis-label" x="'+(PAD.l-12)+'" y="'+(y(v)+5)+'" text-anchor="end">'+esc(fmt(v))+'</text>';
  }
  labels.forEach((l,i)=>{
    let acc=0;
    seriesList.forEach((ser,si)=>{
      const v=ser.values[i]||0; if(v<=0) return;
      const top=y(acc+v), hh=y(acc)-y(acc+v);
      s+='<rect x="'+(cx(i)-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+Math.max(1,hh)+'" fill="'+
         (ser.color||PALETTE[si%PALETTE.length])+'"><title>'+esc(ser.name+" · "+l+": "+fmt(v))+'</title></rect>';
      acc+=v;
    });
    s+='<text class="axis-label" x="'+cx(i)+'" y="'+(h-PAD.b+26)+'" text-anchor="middle">'+esc(l)+'</text>';
  });
  s+='</svg><div class="legend">'+seriesList.map((ser,si)=>'<span><i style="background:'+
    (ser.color||PALETTE[si%PALETTE.length])+'"></i>'+esc(ser.name)+'</span>').join("")+'</div>';
  s+=srTable(o.title||"Chart data",["Series"].concat(labels),
      seriesList.map(ser=>[ser.name].concat(ser.values.map(v=>fmt(v)))));
  return s;
}

/* waterfall */
function waterfall(items, o={}){
  const h=o.height||360, fmt=o.fmt||(v=>eur(v));
  let acc=0; const pts=[];
  items.forEach(it=>{
    if(it.total){ pts.push({label:it.label, from:0, to:acc, total:true, value:acc}); }
    else { pts.push({label:it.label, from:acc, to:acc+it.value, value:it.value}); acc+=it.value; }
  });
  const vals=[0]; pts.forEach(p=>{vals.push(p.from);vals.push(p.to);});
  const sc=niceScale(Math.min.apply(null,vals), Math.max.apply(null,vals));
  const y=v=> h-PAD.b - (v-sc.lo)/(sc.hi-sc.lo)*(h-PAD.t-PAD.b);
  const bw=(W-PAD.l-PAD.r)/pts.length*0.56;
  const cx=i=> PAD.l + (i+0.5)*(W-PAD.l-PAD.r)/pts.length;
  let s=svgOpen(h,o.title||"Waterfall chart");
  for(let v=sc.lo; v<=sc.hi+1e-9; v+=sc.step){
    s+='<line class="grid-line" x1="'+PAD.l+'" x2="'+(W-PAD.r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/>'+
       '<text class="axis-label" x="'+(PAD.l-12)+'" y="'+(y(v)+5)+'" text-anchor="end">'+esc(fmt(v))+'</text>';
  }
  s+='<line class="zero-line" x1="'+PAD.l+'" x2="'+(W-PAD.r)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  pts.forEach((p,i)=>{
    const top=Math.min(y(p.from),y(p.to)), hh=Math.max(3,Math.abs(y(p.to)-y(p.from)));
    const col=p.total?"#0B101D":(p.value>=0?"#16A34A":"#EF4444");
    s+='<rect x="'+(cx(i)-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+hh+'" rx="6" fill="'+col+'">'+
       '<title>'+esc(p.label+": "+fmt(p.value))+'</title></rect>'+
       '<text class="value-label" x="'+cx(i)+'" y="'+(top-11)+'" text-anchor="middle" style="font-size:14px">'+esc(fmt(p.value))+'</text>';
    if(i<pts.length-1) s+='<line x1="'+(cx(i)+bw/2)+'" x2="'+(cx(i+1)-bw/2)+'" y1="'+y(p.to)+'" y2="'+y(p.to)+
      '" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 4"/>';
    const words=p.label.split(" "); let line="",lines=[];
    words.forEach(w=>{ if((line+" "+w).trim().length>15){lines.push(line.trim());line=w;} else line+=" "+w; });
    lines.push(line.trim());
    lines.forEach((ln,li)=> s+='<text class="axis-label" x="'+cx(i)+'" y="'+(h-PAD.b+22+li*17)+
      '" text-anchor="middle" style="font-size:13px">'+esc(ln)+'</text>');
  });
  s+='</svg>'+srTable(o.title||"Waterfall data",["Step","Value"],pts.map(p=>[p.label,fmt(p.value)]));
  return s;
}

/* sortable table */
let tblSeq=0;
function makeTable(cols, rows, o={}){
  const id="tbl"+(++tblSeq);
  let h='<div class="tbl-wrap"><table id="'+id+'"><thead><tr>';
  cols.forEach((c,i)=> h+='<th class="'+(o.sortable?"sortable":"")+'" data-col="'+i+'">'+esc(c)+'</th>');
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr'+(r.cls?' class="'+r.cls+'"':'')+'>';
    (r.cells||r).forEach((c,i)=>{
      const cell = (c&&typeof c==="object") ? c : {t:c};
      h+='<td class="num '+(cell.cls||"")+'" data-v="'+(cell.v!==undefined?cell.v:"")+'">'+
         (cell.html?cell.html:esc(cell.t===undefined?"—":cell.t))+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  if(o.sortable) pendingSorts.push(id);
  return h;
}
let pendingSorts=[];
function wireSorts(){
  pendingSorts.forEach(id=>{
    const t=document.getElementById(id); if(!t) return;
    t.querySelectorAll("th.sortable").forEach(th=>{
      th.setAttribute("tabindex","0");
      const go=()=>{
        const ci=+th.dataset.col, tb=t.tBodies[0];
        const desc = th.classList.contains("desc") ? false : true;
        t.querySelectorAll("th").forEach(o=>o.classList.remove("asc","desc"));
        th.classList.add(desc?"desc":"asc");
        Array.from(tb.rows).sort((a,b)=>{
          const av=a.cells[ci].dataset.v, bv=b.cells[ci].dataset.v;
          const an=parseFloat(av), bn=parseFloat(bv);
          const both = av!==""&&bv!==""&&!Number.isNaN(an)&&!Number.isNaN(bn);
          const r = both ? an-bn : String(a.cells[ci].textContent).localeCompare(String(b.cells[ci].textContent));
          return desc ? -r : r;
        }).forEach(tr=>tb.appendChild(tr));
      };
      th.onclick=go;
      th.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
    });
  });
  pendingSorts=[];
}

function card(cls, title, note, body){
  return '<section class="card '+cls+'">'+wm+
    (title?'<div class="card-title">'+esc(title)+'</div>':'')+
    (note?'<div class="card-note">'+note+'</div>':'')+ body +'</section>';
}
function stat(label, value, deltaHtml, cls){
  return '<section class="card '+(cls||"s3")+'">'+wm+
    '<div class="stat-label">'+esc(label)+'</div>'+
    '<div class="stat-value">'+esc(value)+'</div>'+
    '<div class="stat-delta">'+deltaHtml+'</div></section>';
}
function kv(k,v,cls){ return '<div class="kv"><span class="k">'+esc(k)+'</span><span class="v '+(cls||"")+'">'+esc(v)+'</span></div>'; }
function progress(pctVal, cls){
  const w=Math.max(0,Math.min(100,pctVal*100));
  return '<div class="bar-track"><div class="bar-fill '+(cls||"")+'" style="width:'+w+'%"></div></div>';
}
function statusPill(s){
  const m={met:["good","Met"],partial:["","Partially met"],missed:["bad","Missed"],none:["info","Not addressed"]};
  const x=m[s]||m.none; return '<span class="pill '+x[0]+'">'+x[1]+'</span>';
}

      "payment terms investment = receivables − payables\nreceivables = customer payment weeks ÷ 26 × realized revenue\npayables    = weighted supplier payment weeks ÷ 26 × purchase value",
      '<p class="lede">For suppliers whose terms start when ordering, effective weeks = payment term − lead time.</p>'+
      '<div class="callout">Validation: predicted €385,887 against an actual €384,555.</div>'),

    card("s6","Structural facts the models rest on","",
      kv("Length of a round","26 weeks, not 24 — all five components reconcile at 26.0")+
      kv("Cost of one FTE","€40,000 a year, so €20,000 per round")+
      kv("Warehouse space","€100 per pallet location per round")+
      kv("Pallet capacity, 1-litre products","600 units")+
      kv("Pallet capacity, PET products","1,440 units")+
      kv("Pallet capacity, Pack / PET components","17,280 / 1,080 pieces")+
      kv("Tank yard","Orange and Mango are stored there, not in the pallet warehouse")+
      kv("ROI sensitivity","€1,000 of profit ≈ 16.5 × €1,000 of investment reduction")),

    card("dark s6","Two places we overrode the model — and were right","",
      '<div class="mini" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#fff">'+
      '<h4>Warehouse sizing</h4><p style="color:rgba(255,255,255,.82);font-size:.92rem;margin:0">'+
      'The first model sized warehouses on average usage. A challenge raised inside the team — <em>you said overflow came from downsizing, but you\u2019re recommending further downsizing</em> — exposed that overflow is a peak event. Rebuilding on peaks reproduced every historical round exactly and moved the recommendation from 700 to 800 pallet locations. The original number would have overflowed badly.</p></div>'+
      '<div class="mini" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#fff;margin-top:14px">'+
      '<h4>The 96% service promise</h4><p style="color:rgba(255,255,255,.82);font-size:.92rem;margin:0">'+
      'The model recommended holding at 95%, because the five-to-one penalty asymmetry makes raising a promise a poor bet when protecting a lead. The team raised it to 96% anyway, judging that the operation could deliver. It landed at exactly 96.00%, adding €30,665 of contracted revenue for a €456 penalty.</p></div>'+
      '<div class="callout">A model tells you the odds. It does not know what your operation is capable of.</div>')
  ].join("");
}

/* ---------- View 8 ---------- */
function v8(){
  const items=[
    ["Set the service promise from measured capability, not ambition",
     eur(Math.abs(F.bonusPenalty[1])+Math.abs(F.bonusPenalty[2])),
     "Rounds 1 and 2 promised 94–95% while the operation was delivering 89–90%. The promise should follow demonstrated capability by one round, not lead it."],
    ["Never move a promise and its supporting stock policy in opposite directions in the same round",
     eur(Math.abs(F.bonusPenalty[2])),
     "Round 2 raised the shelf-life promise from 75% to 80% while cutting finished-goods safety stock by a third. Obsolescence reached 11.07% and penalties hit the worst level of the game."],
    ["Size warehouses on peak, not average, from the first round",
     eur(DATA.costDetail.spaceRmOverflow[4]),
     "The Round 4 downsizing to 850 pallet locations produced 3.00% overflow, roughly €9,450 including the labour knock-on, against €10,000 of pallet-location savings. Close to a wash, and avoidable."],
    ["Diagnose availability bottom-up from the start",
     "4 rounds",
     "The Vitamin C constraint sat unaddressed for four rounds and was worth roughly six percentage points of service on two products. It was found in Round 5 by ranking components by availability rather than by spend — a five-minute analysis that could have been done in Round 1."],
    ["Treat forecast error as a lever",
     "47% – 61%",
     "MAPE never moved across seven rounds. Every point of forecast error is absorbed by safety stock, which is stock cost and stock investment, and both sit directly in ROI."]
  ];
  return items.map((it,i)=> card(i<2?"s6":"s4","", "",
    '<div class="stat-label">What it cost</div>'+
    '<div class="stat-value" style="font-size:2.1rem">'+esc(it[1])+'</div>'+
    '<div class="card-title" style="margin-top:12px">'+esc(it[0])+'</div>'+
    '<p class="lede" style="font-size:.93rem;margin-top:8px">'+esc(it[2])+'</p>')).join("")
    + card("hero s12","","",'<div class="quote" style="font-size:1.7rem">We never grew volume. We did not need to.</div>'+
      '<div class="quote-sub">'+eur(F.operatingProfit[6]-F.operatingProfit[1])+
      ' of operating profit improvement came entirely from closing the gap between what was promised and what could be delivered.</div>');
}

/* ============================================================
   6. Router
   ============================================================ */
let current=0;
function renderNav(){
  document.getElementById("nav").innerHTML = VIEWS.map((v,i)=>
    '<button class="nav-item" data-i="'+i+'"'+(i===current?' aria-current="page"':'')+'>'+
    esc(v.navTitle||v.title)+'<span class="nav-key">'+(i+1)+'</span></button>').join("");
  document.querySelectorAll(".nav-item").forEach(b=> b.onclick=()=>go(+b.dataset.i));
}
function go(i){
  if(i<0||i>=VIEWS.length) return;
  current=i;
  const v=VIEWS[i];
  document.getElementById("view-title").textContent=v.title;
  document.getElementById("view-sub").textContent=v.sub;
  document.getElementById("views").innerHTML='<div class="view active"><div class="bento">'+v.build()+'</div></div>';
  wireSorts();
  renderNav();
  window.scrollTo({top:0,behavior:"instant"});
  location.hash=v.id;
}
function initRoundPicker(){
  const sel=document.getElementById("round-select");
  sel.innerHTML=[0,1,2,3,4,5,6].map(r=>'<option value="'+r+'"'+(r===6?" selected":"")+'>Round '+r+(r===0?" (inherited)":"")+(r===6?" — final":"")+'</option>').join("");
  sel.onchange=()=>{ ROUND=+sel.value; document.getElementById("sf-roi").textContent=pct(F.roi[ROUND]); go(current); };
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")) return;
  if(e.key>="1"&&e.key<="8"){ go(+e.key-1); }
  else if(e.key==="ArrowRight"){ go(Math.min(VIEWS.length-1,current+1)); }
  else if(e.key==="ArrowLeft"){ go(Math.max(0,current-1)); }
});
(function init(){
  runChecks();
  initRoundPicker();
  const h=location.hash.replace("#","");
  const idx=VIEWS.findIndex(v=>v.id===h);
  go(idx>=0?idx:0);
})();
</script>
